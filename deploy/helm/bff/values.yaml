nameOverride: ""
fullnameOverride: ""
replicaCount: 2
image:
  registry: ""          # p. ej. miacr.azurecr.io
  repository: validador/bff
  tag: ""               # por defecto appVersion del chart
  pullPolicy: IfNotPresent
containerPort: 3000
service:
  port: 80
terminationGracePeriodSeconds: 30
readOnlyRootFilesystem: true
env:
  PORT: "3000"
  DOCUMENTS_SERVICE_URL: "http://documents-service"
  CORS_ORIGIN: "https://validador.example.com"
  LOG_LEVEL: "info"
probes:
  port: 3000
  livePath: /health/live
  readyPath: /health/ready
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { memory: 256Mi }
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPU: 70
keda:
  enabled: false   # solo el worker escala con KEDA
pdb:
  enabled: true
  minAvailable: 1
metrics:
  enabled: false
  port: 0
  path: /metrics
workloadIdentity:
  clientId: ""          # client id de la identidad administrada federada
secretsStore:
  enabled: false
  keyVaultName: ""
  tenantId: ""
  secretName: bff-secrets
  objects: []           # [{ keyVaultSecret: nombre-en-kv, key: CLAVE_EN_SECRET }]
secretEnv: []           # [{ name: VAR, secretName: bff-secrets, key: CLAVE_EN_SECRET }]
networkPolicy:
  enabled: true
  allowFrom: []
  allowNamespaceLabels: { kubernetes.io/metadata.name: app-routing-system }
ingress:
  enabled: false
  className: webapprouting.kubernetes.azure.com
  host: ""
  paths: []
  annotations: {}
  tls: []
nodeSelector: {}
tolerations: []
