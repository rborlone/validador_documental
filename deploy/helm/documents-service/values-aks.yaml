# Valores de ejemplo para AKS. Reemplaza los <...>.
image:
  registry: <acr>.azurecr.io
workloadIdentity:
  clientId: <client-id-identidad-federada>
secretsStore:
  enabled: true
  keyVaultName: <key-vault>
  tenantId: <tenant-id>
  objects:
    - { keyVaultSecret: documents-database-url, key: DATABASE_URL }
    - { keyVaultSecret: rabbitmq-url, key: RABBITMQ_URL }
    - { keyVaultSecret: storage-connection-string, key: AZURE_STORAGE_CONNECTION_STRING }
secretEnv:
  - { name: DATABASE_URL, secretName: documents-service-secrets, key: DATABASE_URL }
  - { name: RABBITMQ_URL, secretName: documents-service-secrets, key: RABBITMQ_URL }
  - { name: AZURE_STORAGE_CONNECTION_STRING, secretName: documents-service-secrets, key: AZURE_STORAGE_CONNECTION_STRING }
