nameOverride: ""
fullnameOverride: ""
replicaCount: 2
image:
  registry: ""          # p. ej. miacr.azurecr.io
  repository: validador/web
  tag: ""               # por defecto appVersion del chart
  pullPolicy: IfNotPresent
containerPort: 8080
service:
  port: 80
terminationGracePeriodSeconds: 10
readOnlyRootFilesystem: true
env: {}
probes:
  port: 8080
  livePath: /
  readyPath: /
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { memory: 128Mi }
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPU: 70
keda:
  enabled: false   # solo el worker escala con KEDA
pdb:
  enabled: true
  minAvailable: 1
metrics:
  enabled: false
  port: 0
  path: /metrics
workloadIdentity:
  clientId: ""          # client id de la identidad administrada federada
secretsStore:
  enabled: false
  keyVaultName: ""
  tenantId: ""
  secretName: web-secrets
  objects: []           # [{ keyVaultSecret: nombre-en-kv, key: CLAVE_EN_SECRET }]
secretEnv: []           # [{ name: VAR, secretName: web-secrets, key: CLAVE_EN_SECRET }]
networkPolicy:
  enabled: true
  allowFrom: []
  allowNamespaceLabels: { kubernetes.io/metadata.name: app-routing-system }
ingress:
  enabled: false
  className: webapprouting.kubernetes.azure.com
  host: ""
  paths: []
  annotations: {}
  tls: []
nodeSelector: {}
tolerations: []
