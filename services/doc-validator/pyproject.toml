[project]
name = "doc-validator"
version = "0.1.0"
description = "Worker que valida documentos (OCR, clasificación, extracción, reglas y autenticidad)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.4",
    "anthropic>=2.3",
    "azure-identity>=1.19",
    "azure-storage-blob[aio]>=12.24",
    "fastapi>=0.115",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    "prometheus-client>=0.21",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymupdf>=1.25",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0",
    "tzdata>=2024.2",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "reportlab>=4.2",
    "ruff>=0.8",
]

[project.scripts]
doc-validator = "validator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/validator"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "SIM", "RUF", "ASYNC", "S", "N"]
ignore = [
    "RUF001", # caracteres ambiguos (texto en español)
    "RUF002",
    "RUF003",
    "S101",   # assert en tests
    "S311",   # random no criptográfico (fixtures)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = [
    "ignore:builtin type .* has no __module__ attribute:DeprecationWarning",
]
markers = [
    "ocr: requiere Tesseract con los idiomas configurados",
]
