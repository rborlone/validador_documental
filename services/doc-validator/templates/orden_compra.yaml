# Orden de compra (empresa compradora -> proveedor).
id: orden_compra
version: "1.1.0"
name: Orden de compra
schema: orden_compra

classification:
  description: >-
    Documento comercial con el que una empresa compradora solicita bienes o servicios a un
    proveedor: número de OC, datos de comprador y proveedor, detalle, neto, IVA y total.
  keywords:
    - { pattern: 'orden\s+de\s+compra', weight: 5 }
    - { pattern: '\bproveedor\b', weight: 2 }
    - { pattern: '(?:fecha|plazo|lugar)\s+de\s+entrega', weight: 2 }
    - { pattern: '(?:condici[oóé6]n(?:es)?|forma)\s+de\s+pago', weight: 1 }
    - { pattern: '\bcomprador\b|empresa\s+compradora|solicitante', weight: 1 }
    - { pattern: '\bneto\b', weight: 1 }
    - { pattern: 'facturar\s+a|despachar\s+a|direcci[oóé6]n\s+de\s+despacho', weight: 1 }

fields:
  - name: numero_oc
    required: true
    patterns:
      - 'orden[ \t]+de[ \t]+compra[ \t]*(?:N[°º.]?|#|n[uúü]mero)?[ \t]*:?[ \t]*(?P<value>(?=[A-Z\-]*\d)[A-Z0-9\-]{3,20})\b'
      # "ORDEN DE COMPRA" y en la línea siguiente "N°: 27031" (no necesariamente al inicio).
      - 'orden[ \t]+de[ \t]+compra[^\n]*\r?\n[^\n]*?(?:\bN[°º]|\bN\.|#|\bn[uúü]mero)<<SEP>>(?P<value>(?=[A-Z\-]*\d)[A-Z0-9\-]{3,20})\b'
  - name: fecha_emision
    type: date
    required: true
    patterns:
      - 'fecha(?:[ \t]+de[ \t]+emisi[oóé6]n)?[ \t]*:[ \t]*(?P<value><<DATE>>)'
      - '^[ \t]*fecha(?:[ \t]+de[ \t]+emisi[oóé6]n)?<<SEP>>(?P<value><<DATE>>)'
  - name: fecha_entrega
    type: date
    patterns:
      - 'fecha[ \t]+de[ \t]+entrega<<SEP>>(?P<value><<DATE>>)'
  - name: rut_comprador
    type: rut
    required: true
    patterns:
      - '(?:comprador|empresa[ \t]+compradora)[^\n]*?R\.?[ \t]?U\.?[ \t]?T\.?[ \t]*:?[ \t]*(?P<value><<RUT>>)'
      # Sin etiqueta "comprador": quien emite la OC es el comprador, y su RUT es el primero
      # del documento antes de la sección del proveedor.
      - '\A(?:(?!proveedor)[\s\S])*?\bR\.?[ \t]?U\.?[ \t]?T\.?<<SEP>>(?P<value><<RUT>>)'
  - name: razon_social_comprador
    patterns:
      - '(?:comprador|empresa[ \t]+compradora)[ \t]*:[ \t]*(?P<value>[^\n]+?)(?:[ \t]+R\.?[ \t]?U\.?[ \t]?T|[ \t]*$)'
  - name: rut_proveedor
    type: rut
    required: true
    patterns:
      - 'proveedor[^\n]*?R\.?[ \t]?U\.?[ \t]?T\.?[ \t]*:?[ \t]*(?P<value><<RUT>>)'
      # Sección "Información de proveedor" con el RUT unas líneas más abajo.
      - 'proveedor[\s\S]{0,300}?\bR\.?[ \t]?U\.?[ \t]?T\.?<<SEP>>(?P<value><<RUT>>)'
  - name: razon_social_proveedor
    patterns:
      - 'proveedor[ \t]*:[ \t]*(?P<value>[^\n]+?)(?:[ \t]+R\.?[ \t]?U\.?[ \t]?T|[ \t]*$)'
      - 'proveedor[\s\S]{0,120}?raz[oó]n[ \t]+social<<SEP>>(?P<value>[^\n]+?)(?:[ \t]+R\.?[ \t]?U\.?[ \t]?T|[ \t]*$)'
  - name: condicion_pago
    patterns:
      # Se corta antes de una etiqueta de montos de la columna vecina (mismo renglón visual).
      - '(?:condici[oóé6]n(?:es)?|forma)[ \t]+de[ \t]+pago[ \t]*:[ \t]*(?P<value>[^\n]+?)(?=[ \t]+(?:impuesto|total|neto|sub[ \t]?total|[IL1l]\.?V\.?A)\b|[ \t]*$)'
  - name: lineas
    type: lines
    section: { start: 'descripci[oóé6]n', end: '\bneto\b' }
    row_pattern: '^[ \t]*(?P<cantidad>\d{1,6})[ \t]+(?P<descripcion>.+?)[ \t]+(?P<precio_unitario><<AMOUNT>>)[ \t]+(?P<total><<AMOUNT>>)[ \t]*$'
    columns: { cantidad: integer, descripcion: string, precio_unitario: amount, total: amount }
  - name: monto_neto
    type: amount
    required: true
    patterns:
      - '\b(?:monto[ \t]+|sub[ \t]?total[ \t]+)?neto<<SEP>>(?P<value><<AMOUNT>>)'
  - name: iva
    type: amount
    required: true
    patterns:
      - '\b[IL1l]\.?[ \t]?V\.?[ \t]?A[.,]?[ \t]*(?:\(?[ \t]*19[ \t]*%[ \t]*\)?)?<<SEP>>(?P<value><<AMOUNT>>)'
  - name: monto_total
    type: amount
    required: true
    occurrence: last
    patterns:
      - '\b(?:monto[ \t]+)?total(?:[ \t]+(?:a[ \t]+pagar|orden))?<<SEP>>(?P<value><<AMOUNT>>)'

rules:
  - { id: rut.comprador, type: rut, field: rut_comprador }
  - { id: rut.proveedor, type: rut, field: rut_proveedor }
  - { id: fecha.emision_no_futura, type: date_not_future, field: fecha_emision, severity: warning }
  - { id: fecha.entrega_posterior, type: date_order, before: fecha_emision, after: fecha_entrega, severity: warning }
  - { id: totals.lineas, type: sum_lines, field: lineas, column: total, target: monto_neto }
  - { id: totals.lineas_items, type: line_items, field: lineas, severity: warning }
  - { id: totals.iva, type: iva, net: monto_neto, vat: iva, rate: 0.19 }
  - { id: totals.total, type: total, net: monto_neto, vat: iva, total: monto_total }
