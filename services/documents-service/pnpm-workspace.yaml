# Servicio independiente (sin workspace raíz). Solo se permiten los scripts de instalación necesarios.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  '@parcel/watcher': false
  '@scarf/scarf': false
  cpu-features: false
  protobufjs: false
  ssh2: false
  unrs-resolver: false
